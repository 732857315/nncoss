[package]
name = "nncoss-knowledge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "nncoss_knowledge"
path = "src/lib.rs"

[[bin]]
name = "nncoss-know"
path = "src/main.rs"

[dependencies]
nncoss-llm = { path = "../nncoss-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
